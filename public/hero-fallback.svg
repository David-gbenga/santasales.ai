<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="body" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f06a7d"/>
      <stop offset="0.35" stop-color="#c8324a"/>
      <stop offset="1" stop-color="#5e1222"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#8a5a1c"/>
      <stop offset="0.45" stop-color="#f7c46b"/>
      <stop offset="1" stop-color="#9a6421"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2a541" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f2a541" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="300" cy="350" r="165"/></clipPath>
  </defs>

  <circle cx="300" cy="350" r="260" fill="url(#glow)"/>

  <!-- string -->
  <line x1="300" y1="0" x2="300" y2="160" stroke="#eef3f7" stroke-opacity="0.55" stroke-width="2"/>

  <!-- ball -->
  <circle cx="300" cy="350" r="165" fill="url(#body)"/>
  <g clip-path="url(#ball)" fill="none" stroke="url(#gold)">
    <ellipse cx="300" cy="350" rx="166" ry="26" stroke-width="10"/>
    <ellipse cx="300" cy="283" rx="151" ry="22" stroke-width="5"/>
    <ellipse cx="300" cy="417" rx="151" ry="22" stroke-width="5"/>
  </g>
  <ellipse cx="245" cy="270" rx="46" ry="26" fill="#ffffff" fill-opacity="0.28" transform="rotate(-30 245 270)"/>

  <!-- cap and loop -->
  <circle cx="300" cy="150" r="14" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <path d="M272 165 h56 l-5 34 h-46 z" fill="url(#gold)"/>

  <!-- snow -->
  <g fill="#eef3f7">
    <circle cx="70" cy="90" r="3" opacity="0.8"/>
    <circle cx="140" cy="210" r="2" opacity="0.6"/>
    <circle cx="520" cy="70" r="3.5" opacity="0.85"/>
    <circle cx="470" cy="190" r="2" opacity="0.6"/>
    <circle cx="560" cy="300" r="3" opacity="0.7"/>
    <circle cx="40" cy="330" r="2.5" opacity="0.7"/>
    <circle cx="95" cy="470" r="3.5" opacity="0.8"/>
    <circle cx="510" cy="460" r="2.5" opacity="0.65"/>
    <circle cx="420" cy="560" r="3" opacity="0.75"/>
    <circle cx="190" cy="565" r="2" opacity="0.6"/>
    <circle cx="380" cy="40" r="2" opacity="0.55"/>
    <circle cx="215" cy="45" r="3" opacity="0.7"/>
  </g>
</svg>
